apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: personal-website
  template:
    metadata:
      labels:
        app: personal-website
    spec:
      containers:
      - name: personal-website
        image: ghcr.io/dixneuf19/personal-website:main
        resources:
          requests:
            memory: "128Mi"
          limits:
            memory: "256Mi"
            cpu: "250m"
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: personal-website
spec:
  selector:
    app: personal-website
  ports:
  - port: 80
    targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: personal-website-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  rules:
  - host: www.dixneuf19.fr 
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: personal-website
            port: 
              number: 80
  tls:
  - hosts:
    - www.dixneuf19.fr
    secretName: www-dixneuf19-fr-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: personal-website-ingress-redirect
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: default-redirect-apex-to-www@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: dixneuf19.fr 
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: personal-website
            port: 
              number: 80
  tls:
  - hosts:
    - dixneuf19.fr
    secretName: dixneuf19-fr-tls
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-apex-to-www
spec:
  redirectRegex:
    regex: ^https?://dixneuf19\.fr/(.*)
    replacement: https://www.dixneuf19.fr/${1}
    permanent: true
